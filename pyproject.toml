[project]
name = "forge-ai-starter-kit"
version = "0.1.0"
description = "A production-quality Python foundation for AI engineering projects."
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1,<0.142",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15.0,<3",
    "structlog>=26.1.0,<27",
    "uvicorn>=0.52.1,<0.53",
]

[dependency-groups]
dev = [
    "black>=26.5.1,<27",
    "httpx>=0.28.1,<1",
    "mypy>=2.3.0,<3",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.2,<0.17",
]

[tool.uv]
package = false
required-version = "==0.12.3"
